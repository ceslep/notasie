<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="descripción" content="Autor: Ing César Patiño, ceslep@gmail.com">
  <meta name="keywords" content="software académico,anserma caldas,colombia">
  <meta name="author" content="Ing. César Patiño">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="theme-color" content="#00FA9A">
  

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="icon-192x192">
  <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <title>I.E de Occidente</title>
  <style>
    body { margin: 0; background: #0f172a; }
    .app-loader {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
    }
    .app-loader .glow-orb {
      position: absolute; border-radius: 50%; filter: blur(80px); animation: orbPulse 4s ease-in-out infinite;
    }
    .app-loader .orb1 { width: 320px; height: 320px; background: rgba(99,102,241,0.12); top: -80px; left: -80px; }
    .app-loader .orb2 { width: 320px; height: 320px; background: rgba(168,85,247,0.12); bottom: -80px; right: -80px; animation-delay: 1.3s; }
    .app-loader .orb3 { width: 384px; height: 384px; background: rgba(236,72,153,0.06); top: 50%; left: 50%; transform: translate(-50%,-50%); animation-delay: 2.6s; }
    .app-loader img {
      width: 96px; height: 96px; object-fit: contain; position: relative; z-index: 1;
      filter: drop-shadow(0 0 30px rgba(99,102,241,0.4));
      animation: logoFadeIn 0.8s ease-out both;
    }
    .app-loader .loader-ring {
      position: absolute; width: 120px; height: 120px; border-radius: 50%;
      border: 1.5px solid rgba(99,102,241,0.15); animation: ringPing 3s ease-out infinite;
    }
    .app-loader h1 {
      margin: 0; font-family: 'Inter', system-ui, sans-serif; font-size: 22px; font-weight: 800;
      letter-spacing: -0.02em; position: relative; z-index: 1;
      background: linear-gradient(135deg, #f8fafc, #a5b4fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: textFadeIn 0.8s 0.2s ease-out both;
    }
    .app-loader p {
      margin: 0; font-family: 'Inter', system-ui, sans-serif; font-size: 11px; color: #64748b;
      letter-spacing: 0.2em; text-transform: uppercase; position: relative; z-index: 1;
      animation: textFadeIn 0.8s 0.35s ease-out both;
    }
    .app-loader .dots { display: flex; gap: 6px; position: relative; z-index: 1; animation: textFadeIn 0.8s 0.5s ease-out both; }
    .app-loader .dot {
      width: 8px; height: 8px; border-radius: 50%; animation: dotBounce 1.2s ease-in-out infinite;
    }
    .app-loader .dot:nth-child(1) { background: #6366f1; animation-delay: 0s; }
    .app-loader .dot:nth-child(2) { background: #a855f7; animation-delay: 0.15s; }
    .app-loader .dot:nth-child(3) { background: #ec4899; animation-delay: 0.3s; }
    @keyframes orbPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes logoFadeIn { from { opacity: 0; transform: scale(0.8) translateY(12px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes ringPing { 0% { transform: scale(1); opacity: 0.4; } 100% { transform: scale(2); opacity: 0; } }
    @keyframes textFadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes dotBounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-8px); } }
  </style>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
    const onreadystatechange = () => {
      if (document.readyState === "complete") {
        const loader = document.getElementById("app-loader");
        if (loader) { loader.style.opacity = "0"; loader.style.transition = "opacity 0.4s"; setTimeout(() => loader.remove(), 400); }
      }
    }
    document.onreadystatechange = onreadystatechange;
  </script>
</head>

<body>
  <div id="app"></div>
  <div class="app-loader" id="app-loader">
    <div class="glow-orb orb1"></div>
    <div class="glow-orb orb2"></div>
    <div class="glow-orb orb3"></div>
    <div class="loader-ring"></div>
    <img src="https://app.iedeoccidente.com/eduadmin/escudohd.png" alt="Escudo" />
    <h1>I.E. de Occidente</h1>
    <p>Plataforma Academica</p>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
