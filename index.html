<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="descripción" content="Autor: Ing César Patiño, ceslep@gmail.com">
  <meta name="keywords" content="software académico,anserma caldas,colombia">
  <meta name="author" content="Ing. César Patiño">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="theme-color" content="#f8fafc">
  <meta name="color-scheme" content="light dark">

  <script>
    // Aplica el tema guardado antes del primer pintado (modo claro por defecto).
    (function () {
      var t = 'light';
      try { t = localStorage.getItem('notasie_theme') === 'dark' ? 'dark' : 'light'; } catch (e) {}
      document.documentElement.classList.toggle('dark', t === 'dark');
      document.documentElement.dataset.theme = t;
      document.documentElement.style.colorScheme = t;
    })();
  </script>
  

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="icon-192x192">
  <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <title>I.E de Occidente</title>
  <style>
    :root {
      --page-bg: #eef2f7;
      --loader-bg: linear-gradient(135deg, #f8fafc 0%, #eef2ff 50%, #eef2f7 100%);
      --loader-title: linear-gradient(135deg, #1e293b, #4f46e5);
    }
    html.dark {
      --page-bg: #0f172a;
      --loader-bg: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --loader-title: linear-gradient(135deg, #f8fafc, #a5b4fc);
    }
    body { margin: 0; background: var(--page-bg); }
    .app-loader {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
      background: var(--loader-bg);
      transition: opacity 0.4s;
    }
    .app-loader .glow-orb {
      position: absolute; border-radius: 50%; filter: blur(80px); animation: orbPulse 4s ease-in-out infinite;
    }
    .app-loader .orb1 { width: 320px; height: 320px; background: rgba(99,102,241,0.12); top: -80px; left: -80px; }
    .app-loader .orb2 { width: 320px; height: 320px; background: rgba(168,85,247,0.12); bottom: -80px; right: -80px; animation-delay: 1.3s; }
    .app-loader .orb3 { width: 384px; height: 384px; background: rgba(236,72,153,0.06); top: 50%; left: 50%; transform: translate(-50%,-50%); animation-delay: 2.6s; }
    .app-loader img {
      width: 96px; height: 96px; object-fit: contain; position: relative; z-index: 1;
      filter: drop-shadow(0 0 30px rgba(99,102,241,0.4));
      animation: logoFadeIn 0.8s ease-out both;
    }
    .app-loader .loader-ring {
      position: absolute; width: 120px; height: 120px; border-radius: 50%;
      border: 1.5px solid rgba(99,102,241,0.15); animation: ringPing 3s ease-out infinite;
    }
    .app-loader h1 {
      margin: 0; font-family: 'Inter', system-ui, sans-serif; font-size: 22px; font-weight: 800;
      letter-spacing: -0.02em; position: relative; z-index: 1;
      background: var(--loader-title); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: textFadeIn 0.8s 0.2s ease-out both;
    }
    .app-loader p {
      margin: 0; font-family: 'Inter', system-ui, sans-serif; font-size: 11px; color: #64748b;
      letter-spacing: 0.2em; text-transform: uppercase; position: relative; z-index: 1;
      animation: textFadeIn 0.8s 0.35s ease-out both;
    }
    .app-loader .loader-aviso {
      max-width: 320px; text-align: center; text-transform: none; letter-spacing: 0;
      font-size: 12px; line-height: 1.5; color: #b91c1c; background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 12px; padding: 10px 14px;
    }
    html.dark .app-loader .loader-aviso { color: #fca5a5; }
    .app-loader .dots { display: flex; gap: 6px; position: relative; z-index: 1; animation: textFadeIn 0.8s 0.5s ease-out both; }
    .app-loader .dot {
      width: 8px; height: 8px; border-radius: 50%; animation: dotBounce 1.2s ease-in-out infinite;
    }
    .app-loader .dot:nth-child(1) { background: #6366f1; animation-delay: 0s; }
    .app-loader .dot:nth-child(2) { background: #a855f7; animation-delay: 0.15s; }
    .app-loader .dot:nth-child(3) { background: #ec4899; animation-delay: 0.3s; }
    @keyframes orbPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes logoFadeIn { from { opacity: 0; transform: scale(0.8) translateY(12px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes ringPing { 0% { transform: scale(1); opacity: 0.4; } 100% { transform: scale(2); opacity: 0; } }
    @keyframes textFadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes dotBounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-8px); } }
  </style>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }

    // El loader de arranque debe desaparecer SIEMPRE. Dos motivos por los que
    // antes podia quedarse pegado:
    //   1. Si la pagina ya estaba en "complete" antes de registrar el evento,
    //      onreadystatechange no se volvia a disparar nunca.
    //   2. Si el modulo de la app fallaba, tampoco se limpiaba.
    (function () {
      var quitar = function () {
        var loader = document.getElementById('app-loader');
        if (!loader) return;
        loader.style.opacity = '0';
        loader.style.transition = 'opacity 0.4s';
        setTimeout(function () { loader.remove(); }, 400);
      };

      // Caso 1: la pagina ya termino (o termina ahora).
      if (document.readyState === 'complete') {
        quitar();
      } else {
        document.addEventListener('readystatechange', function () {
          if (document.readyState === 'complete') quitar();
        });
        window.addEventListener('load', quitar);
      }

      // Caso 2: red de seguridad. Si a los 8 segundos la app no ha montado,
      // se retira el loader y se avisa en vez de dejar la animacion para siempre.
      setTimeout(function () {
        var app = document.getElementById('app');
        if (app && app.children.length === 0) {
          var loader = document.getElementById('app-loader');
          if (loader) {
            var aviso = loader.querySelector('.loader-aviso');
            if (!aviso) {
              aviso = document.createElement('p');
              aviso.className = 'loader-aviso';
              aviso.textContent = 'No se pudo iniciar la aplicacion. Abre la consola del navegador (F12) para ver el error.';
              loader.appendChild(aviso);
            }
          }
          return; // se deja el loader con el aviso, es informacion util
        }
        quitar();
      }, 8000);
    })();
  </script>
</head>

<body>
  <div id="app"></div>
  <div class="app-loader" id="app-loader">
    <div class="glow-orb orb1"></div>
    <div class="glow-orb orb2"></div>
    <div class="glow-orb orb3"></div>
    <div class="loader-ring"></div>
    <img src="https://app.iedeoccidente.com/eduadmin/escudohd.png" alt="Escudo" />
    <h1>I.E. de Occidente</h1>
    <p>Plataforma Academica</p>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
